[permissions]
admin_users = []
allow_guest_users = true

[persona]
# DSH 执行模式：d_teacher (代码专家/三步法) 或 custom (自定义模式)
mode_name = "d_teacher"
# 自定义模式下的 System Prompt（当 mode_name = "custom" 时生效，支持完全自定义）
custom_system_prompt = ""

[model]
# DSH 智能体执行大模型配置（默认使用 DeepSeek 官方 Flash 极速模型）
provider = "deepseek-official"
model = "deepseek-v4-flash"

[plugin]
enabled = true
config_version = "0.1.0"
mode = "acp"
trigger_prefix = "#dsh"
enable_natural_language = true
block_critical_commands = true
prompt_refresh_interval = 10
prompt_pool_max_size = 12
heartbeat_interval_sec = 300.0
max_timeout_sec = 1800.0
session_match_threshold = 0.45
session_idle_expire_sec = 1800.0

[acp]
dsh_bin = "/home/a1/.npm-global/bin/dsh"
default_cwd = "/main/app/github/deepseek-harness"

[post]
gateway_url = "http://127.0.0.1:3080/api/dsh/v1"
token = ""
